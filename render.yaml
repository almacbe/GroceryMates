services:
  - type: web
    name: grocery-mates-app
    env: docker
    plan: free
    dockerfilePath: ./Dockerfile
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_NAME
        value: GroceryMates
      - key: APP_KEY
        generateValue: true
      - key: DB_CONNECTION
        value: pgsql
      - key: APP_URL
        value: https://grocery-mates-app.onrender.com
      - key: LOG_CHANNEL
        value: stderr
      - key: DATABASE_URL
        fromDatabase:
          name: grocery-mates-db
          property: connectionString
    healthCheckPath: /

databases:
  - name: grocery-mates-db
    plan: free
