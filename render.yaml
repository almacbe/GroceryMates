services:
  - type: web
    name: grocery-mates-app
    env: docker
    plan: free
    dockerfilePath: ./Dockerfile
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_NAME
        value: GroceryMates
      - key: APP_KEY
        value: base64:PLACEHOLDER_SET_IN_RENDER_DASHBOARD
      - key: DB_CONNECTION
        value: pgsql
      - key: APP_URL
        value: https://grocery-mates-app.onrender.com
      - key: ASSET_URL
        value: https://grocery-mates-app.onrender.com
      - key: LOG_CHANNEL
        value: stderr
      - key: DATABASE_URL
        fromDatabase:
          name: grocery-mates-db
          property: connectionString
      - key: DB_HOST
        fromDatabase:
          name: grocery-mates-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: grocery-mates-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: grocery-mates-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: grocery-mates-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: grocery-mates-db
          property: password
    healthCheckPath: /

databases:
  - name: grocery-mates-db
    plan: free
